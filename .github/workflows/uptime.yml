# Is the live API answering? Every half hour, from outside.
#
# In October 2026 every function crashed on load for three days and nothing
# said so: a deploy moved them from the Bun runtime to Node, which cannot
# resolve the extensionless imports in api/. A failed run here emails whoever
# last changed this file.
#
# health proves the runtime and the database; the others are the public reads
# visitors depend on, each a separate function that can fail on its own.
#
# GitHub pauses scheduled workflows after 60 days without a commit to the
# repository, and says so by email.

name: uptime

on:
  schedule:
    # The API check.
    - cron: '7,37 * * * *'
    # The API check and the backup. Off the half hour so the two never collide.
    - cron: '22 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the public API
        run: |
          site=https://teletext.joaobernardo.me
          failed=0
          for path in /api/health /api/guestbook /api/showcase /api/menus "/api/snapshot?boot=1"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --compressed --retry 2 --retry-all-errors --max-time 30 "$site$path")
            echo "$status $path"
            [ "$status" = 200 ] || failed=1
          done
          exit $failed

      # The backup that used to run once a day at 04:00 (the Vercel cron, still
      # there as a fallback), now every six hours, so a wiped or drawn-over
      # playground costs hours of drawings rather than a day. Drawn-over pages
      # are recoverable because live_pages keeps earlier versions (migration
      # 017; `bun run db:restore --at`).
      #
      # Not every half hour: each backup that changes something makes the next
      # page load rebuild the boot cache, a ~9 MB read out of Neon, whose free
      # plan allows 5 GB a month (see docs/implementation-notes/2026-11-01-neon-transfer.md).
      # Runs on the six-hour schedule, and when started by hand.
      #
      # It also watches the live document's size. playhtml's server ran out of
      # memory opening the room at ~8 MB in October 2026 and nothing live worked
      # until the room was replaced; anyone can write to the room, so a script
      # can grow it. Failing at 3 MB leaves time to act.
      #
      # Needs the repository secret CRON_SECRET, the same value as on Vercel.
      - name: Back up the playground and check the document's size
        if: ${{ !cancelled() && github.event.schedule != '7,37 * * * *' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_BYTES: 3000000
        run: |
          body=$(curl -s --compressed --max-time 70 -H "Authorization: Bearer $CRON_SECRET" \
            https://teletext.joaobernardo.me/api/snapshot)
          echo "$body"
          echo "$body" | jq -e '.ok == true' > /dev/null || { echo "::error::The backup failed."; exit 1; }
          bytes=$(echo "$body" | jq '.bytes // 0')
          if [ "$bytes" -gt "$MAX_BYTES" ]; then
            echo "::error::The live document is $bytes bytes (alarm at $MAX_BYTES; ~8 MB crashed it before)."
            exit 1
          fi
